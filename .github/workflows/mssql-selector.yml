name: MSSQL selector

on:
  pull_request:
    paths:
      - "connectorx/**"
      - "Cargo.lock"
      - ".github/workflows/mssql-selector.yml"
  workflow_dispatch:

jobs:
  selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          default: true
      - name: Install native authentication dependency
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - name: Missing-backend and parser checks
        run: cargo test -p connectorx --locked --lib --features dst_arrow source_router::tests
      - name: Both SQL Server transports and operation snapshots
        run: cargo test -p connectorx --locked --lib --features src_mssql,dst_arrow
